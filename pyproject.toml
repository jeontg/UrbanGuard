[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tot-dashboard"
version = "0.1.0"
description = "Unified flood / traffic-weather / crowd-safety monitoring dashboard (merge of underpath_flood_dashboard, flood3, SAM)"
requires-python = ">=3.11,<3.14"
readme = "README.md"

# Union of underpath_flood_dashboard/requirements.txt, flood3/requirements.txt,
# SAM/requirements.txt. Verified in docs/integration_plan.md section 5-7 to have
# no version-range conflicts. torch and Pillow were implicit/transitive in the
# original projects and are made explicit here.
dependencies = [
    # NOTE: SAM3_install.py's documented requirement is numpy>=1.26,<2, but that
    # range has no prebuilt wheel for Python 3.13 (numpy 1.26 predates 3.13) and
    # fails to build from source without a C compiler. Left unpinned here; if
    # Phase 5 (crowd-gpu) needs numpy<2 on an older Python, pin it in that venv
    # specifically rather than here.
    "numpy>=1.26",
    "pydantic>=2.11",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "pillow>=10.0",
    "opencv-python>=4.10",
    "ultralytics>=8.3",
    "supervision>=0.20",
    # 추적기. supervision.ByteTrack 이 0.28.0 에서 폐기되고 0.31.0 에서
    # 제거되며, 후속이 이 패키지의 ByteTrackTracker 다. 어댑터
    # (common/tracking.py)가 둘 중 있는 것을 고르므로 없어도 뜨지만,
    # **없으면 폐기 예정 구현으로 도는 상태**가 된다.
    "trackers>=2.6",
    "lapx>=0.5",
    "torch>=2.2",
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "openpyxl>=3.1",
    "python-dotenv>=1.1",
    "google-genai>=0.3",
    # 2026-08-26 — 온프레미스(폐쇄망) VLM 백엔드(common/vlm.py,
    # TOT_VLM_BACKEND=openai_compatible)가 쓴다. vLLM·Ollama 등 OpenAI 호환
    # 서버를 부르는 용도라 google-genai와 같은 지연 임포트 + 실패 시 우아한
    # 처리 패턴을 따른다(핵심 의존성이지만 코드는 ImportError를 감싼다).
    "openai>=1.0",
    "solapi>=5.0",
    # AI 모델 학습(core/training_jobs.py)이 학습 서브프로세스의 생사를
    # 재부팅 후에도 확인하는 데 쓴다. torch/ultralytics의 전이 의존성으로
    # 이미 설치돼 있었으나 직접 의존성으로 명시하지 않으면 향후 그쪽
    # 의존성이 빠질 때 조용히 사라질 수 있다.
    "psutil>=6.0",
    "imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
# A(underpath_flood_dashboard)'s Streamlit UI, kept only as an optional legacy
# tool while the FastAPI dashboard (service/) is being built out (Phase 7).
legacy-streamlit = [
    "streamlit>=1.40",
    "streamlit-image-coordinates>=0.1.9",
]
# C(SAM)'s local-GPU SAM3 pipeline. Requires CUDA + a local sam3.pt checkpoint;
# not needed for the flood / traffic-weather domains or for viewing pre-computed
# crowd cases in the dashboard. See docs/integration_plan.md Phase 5.
crowd-gpu = [
    "iopath>=0.1.10",
    "timm>=1.0.17",
    "ftfy==6.1.1",
    "regex",
    "huggingface_hub",
    "einops",
    "scikit-image",
    "scikit-learn",
    "matplotlib",
    "scipy",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
tot-service = "tot_dashboard.service.main:run"
tot-flood-standalone = "tot_dashboard.flood.standalone_pipeline:main"
tot-traffic-poc = "tot_dashboard.traffic_weather.run_poc:main"
tot-crowd-pipeline = "tot_dashboard.crowd.sam3_pipeline:main"
# 계정 관리 — 설치 가이드·운영자 매뉴얼이 이 이름으로 안내한다.
# urbanguard-bootstrap 은 문서에만 있고 실제로는 등록돼 있지 않았다.
urbanguard-bootstrap = "tot_dashboard.core.bootstrap:main"
urbanguard-passwd = "tot_dashboard.core.account_recovery:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
