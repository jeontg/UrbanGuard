# 교통위험 판정 임계값 설정 (신설, 화면번호 미배정 — docs/pending_tasks.md 참고)
#
# 강수·속도저하·정지차량을 조합해 교통위험 등급(TWR_*)을 가르는 임계값과
# 위험 점수 가중치입니다. 침수의 위험도 임계값(S-82, risk_config.yaml)과
# 같은 방식·같은 편집 화면 구조를 씁니다.
#
# ⚠️ 근거 표기 원칙 — risk_config.yaml과 동일합니다.
#     [자체] = 개발사가 자체 판단으로 정한 값(외부 기준·통계 근거 없음)
#   이 파일의 모든 값이 [자체]입니다 — 2026-08-24 전까지는 코드
#   (traffic_weather/agents/semantic_agent.py)에 리터럴로 고정돼 있어
#   화면에서 바꿀 수 없었습니다. 이번에 그 값을 그대로 옮겨 왔을 뿐,
#   재검토를 거친 새 값이 아닙니다 — 시범운영 중 재조정이 필요합니다.
#
# ※ 항목 끝의 주석은 설정 화면에 도움말로 그대로 표시됩니다.
#
# ⚠️ 날씨 강도 구간(약함/보통/강함/매우강함) 자체의 경계값과, 이 값들을
#   조합하는 판정 순서(예: "폭우+정지차량 2대 이상"이 먼저 걸리는지)는
#   이 화면에서 바꿀 수 없습니다 — 범주 조합 로직이라 단순 편집 화면에
#   넣으면 오히려 판정을 깨뜨릴 위험이 큽니다(침수 설정의 weights/grade_bins
#   가 읽기전용인 것과 같은 이유).

# --- 속도저하 임계값 (0.0~1.0, 자유흐름 대비 감속 비율) ------------------
speed_drop_notable: 0.2   # [자체] 이 이상 느려지면 "평균속도 N% 감소"를 근거로 기록하고 판정에 반영
speed_drop_heavy: 0.4     # [자체] 정체 상태 + 이 이상 느려지면 강우정체(TWR_RAIN_CONGESTION)로 격상

# --- 대기열·정지차량 임계값 ------------------------------------------------
queue_len_notable: 3      # [자체] 정체 대기열이 이 대수 이상이면 근거에 기록
stalled_notable: 1        # [자체] 정지 차량이 이 대수 이상이면 근거에 기록
stalled_severe: 2         # [자체] 폭우(또는 중간강도 비)+이 대수 이상 정지면 심각(TWR_SEVERE_*)으로 판정

# --- 위험 점수 가중치 (합계 1.0) -------------------------------------------
score_weight_rain: 0.45         # [자체] 위험 점수 중 강수 항목 가중치
score_weight_speed_drop: 0.35   # [자체] 위험 점수 중 속도저하 항목 가중치
score_weight_stalled: 0.20      # [자체] 위험 점수 중 정지차량 항목 가중치

# --- 점수 환산 상한 (이 값에서 그 항목 점수가 1.0으로 포화) ----------------
rain_cap_mm_h: 30.0       # [자체] 강수 점수가 1.0이 되는 강수량(mm/h)
stalled_cap: 5.0          # [자체] 정지차량 점수가 1.0이 되는 대수
