# 위험도 산정 설정 (S-82) — 침수·교통위험
#
# ⚠️ 근거 표기 원칙
#   이 파일의 값은 **전부 개발사 자체 판단**입니다. 외부 기준·통계에 근거한
#   값이 하나도 없습니다. 각 항목 끝의 [자체] 표시가 그 뜻입니다.
#     [자체] = 시범 영상 관찰로 정한 값
#     [외부] = 법령·지침·공표 기준에 근거한 값 (현재 해당 없음)
#   근거 정리 문서: docs/202608151713/threshold_rationale.md
#
# ⚠️ 이 값들은 **부산 실환경에서 검증되지 않았습니다.** 시범운영 중 지점별로
#   재조정해야 하며, 확정 기준은 재난 담당부서 협의가 필요합니다.
#
# ※ 항목 끝의 주석은 설정 화면(S-82)에 도움말로 그대로 표시됩니다.
#   줄 끝 주석만 표시되므로, 설명을 길게 쓰려면 위 근거 문서를 쓰십시오.

# --- 위험도 점수 가중치 (합계 0.94, RiskEngine이 남은 요소로 자동 재정규화) --
# [자체] 6개 항목의 배분은 개발사가 정했습니다. 배분에 쓴 판단 두 가지 —
#   ① 「도로가 얼마나 잠겼나」(area+low_point=0.52)가 절반을 넘어야 한다.
#      나머지는 그 상황을 보조 설명하는 신호이기 때문
#   ② 사람(person)은 가중치가 낮아도 하한선(person_danger_floor)으로 따로
#      끌어올린다. 가중 평균에 묻히면 안 되는 항목이라서
# ⚠️ 항목 수와 배분 모두 재난 담당부서 검토가 필요합니다.
# ★ 2026-08-21 flood/traffic 도메인 분리: "traffic"(정체·정지 차량, 6%)
#   가중치를 제거했습니다. 위 6개 항목의 상대 비율은 그대로이며, RiskEngine의
#   정규화 로직이 이 6개 합(0.94)만으로 자동 재분배합니다(별도 재산정 불필요).
weights:
  area: 0.28          # [자체] 도로 ROI 중 물이 덮은 면적 비율
  low_point: 0.24     # [자체] 저지대 ROI 침수 — 지하차도·굴다리 등
  lane: 0.1           # [자체] 차선 기준선 침범
  expansion: 0.1      # [자체] 물이 번지는 속도
  tire: 0.12          # [자체] 차량 바퀴 잠김 정도
  person: 0.1         # [자체] 보행자 노출 (하한선으로 별도 보정)

expansion_ref: 0.05          # [자체] 확산 속도를 1.0 으로 환산하는 기준. 초당 면적비 0.05 증가를 최대 속도로 봄. 통계 근거 없음
person_danger_floor: 85.0    # [자체] 보행자가 물에 노출되면 이 점수 아래로 안 내려감(85=4등급). 사람이 있는 상황을 「보통」으로 표시하지 않겠다는 운영 판단
shutdown_rising_floor: 90.0  # [자체] 물이 계속 번지는 중이면 이 점수 아래로 안 내려감(90=5등급)

# [자체] 0~100점을 5등급으로 나누는 경계. 20단위 균등 분할이며 재난 대응
#        단계(관심·주의·경계·심각)와 1:1로 맞춘 것이 아닙니다.
# ⚠️ 기관의 재난 대응 단계와 대응시키려면 재조정이 필요합니다.
grade_bins:
- 20
- 40
- 60
- 80

# --- 예측 (몇 초 뒤 위험도) -----------------------------------------------
# [자체] 짧은 선형 외삽입니다. **수문 모델이 아니며** 강우량·배수 용량·지형을
#        쓰지 않고 화면에서 물이 번지는 속도만 봅니다.
horizons_sec:
- 5
- 10
predict_window_sec: 12.0   # [자체] 최근 12초 관측으로 기울기를 냄
predict_min_points: 3      # [자체] 3점 미만이면 「정보 부족」으로 표시
trend_surge: 0.03          # [자체] 초당 면적비 증가가 이 이상이면 「급상승」
trend_rising: 0.005        # [자체] 이 이상이면 「상승」
trend_falling: -0.005      # [자체] 이 이하면 「하강」
eta_max_sec: 600           # [자체] 도달 예상 시각 표시 상한(10분)
