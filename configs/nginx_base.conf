worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # ────────────────────────────────────────────────────────────────
    # UrbanGuard API 게이트웨이(계획서
    # C:\Users\전태건\.claude\plans\ticklish-discovering-pine.md 참고)
    #
    # Phase 0(2026-08-31) — 기존 단일 앱(platform-shell, 127.0.0.1:8033)
    # 앞에 리버스 프록시를 세움.
    # Phase 1(2026-08-31, 같은 날 후속) — 인파관리(SAM3 케이스 뷰어 +
    # 알림)를 별도 서비스(crowd-service, 127.0.0.1:8034)로 분리하고
    # 경로별로 라우팅을 나눈다. `/crowd`·`/crowd/cases` 화면(HTML)은
    # 여전히 platform-shell이 서빙한다(4개 도메인 공용 셸이라 화면까지
    # 옮기면 이득보다 비용이 큼 — 계획서 §서비스 경계 지도) — 그래서
    # `/crowd` 자체는 이 파일에 별도 location이 없다(기본 `/` 규칙이
    # platform-shell로 보낸다).
    # Phase 2(2026-08-31, 같은 날 후속) — 노면관리를 별도 서비스
    # (road-service, 127.0.0.1:8035)로 같은 방식으로 분리. `/road`·
    # `/road/detect` 화면(HTML)도 같은 이유로 platform-shell에 남는다.
    #
    # ⚠️ TLS는 아직 넣지 않았다 — 자체 서명 인증서를 임의로 만들어
    # "TLS 적용"이라고 표시하면 실제로는 아무 신뢰 사슬도 없는 인증서를
    # 진짜처럼 보이게 하는 것과 같다(이 저장소 전체의 "지어내지 않는다"
    # 원칙, docs/202608310943/spec.md 11절). 실제 인증서(사내 PKI 또는
    # 발급받은 인증서)가 준비되면 443 server 블록을 별도로 추가한다.
    # ────────────────────────────────────────────────────────────────
    upstream urbanguard_platform {
        server 127.0.0.1:8033;
    }

    upstream urbanguard_crowd {
        server 127.0.0.1:8034;
    }

    upstream urbanguard_road {
        server 127.0.0.1:8035;
    }

    # Phase 4(2026-08-31) — 침수·교통위험 완전 분리. 아래 location들은
    # 아직 이 파일에 없다(진행 순서 3에서 추가 — 계획서 §Phase 4 상세
    # 설계 참고) — 그 전까지 /api/risk·/api/history·/api/stream/risk는
    # 기본 `/` 규칙으로 platform-shell(옛 PipelineRunner)이 그대로
    # 응답한다.
    upstream urbanguard_flood {
        server 127.0.0.1:8036;
    }

    upstream urbanguard_traffic {
        server 127.0.0.1:8037;
    }

    server {
        listen       8080;
        server_name  _;

        # 영상 업로드(S-23 등)가 있어 기본값(1m)보다 넉넉히 둔다.
        client_max_body_size 200m;

        access_log  logs/gateway_access.log;
        error_log   logs/gateway_error.log;

        # ⚠️ 2026-08-31 — 죽은 백엔드 대신 다른 upstream으로 자동 전환하지
        # 않는다(어느 location에도 proxy_next_upstream을 안 씀). 인파관리
        # 서비스가 죽었다고 platform-shell이 대신 응답하면 "침수 서비스가
        # 죽었는데 교통 서비스가 대신 응답"하는 것과 같은 거짓 상태가
        # 된다 — 502/504를 그대로 브라우저에 전달한다(공통 설계 원칙).
        #
        # ⚠️ 2026-08-31(Phase 3) — 아래 crowd/road API location에
        # proxy_connect_timeout만 3초로 줄인다. 백엔드가 완전히 죽어
        # 포트가 안 열려 있으면 TCP 연결이 즉시 거부되므로(루프백) 이
        # 값은 사실 "포트는 열려 있는데 accept 이후로 안 받는" 드문
        # 사고만 3초로 앞당긴다 — 안전하다. proxy_read_timeout은
        # 일부러 건드리지 않는다: 영상 업로드(/api/road/collect/video)·
        # 실제 분석 실행(/api/road-analysis/run, /api/crowd/analyze)이
        # 몇 초를 넘길 수 있는데, 실측 소요시간 기준이 아직 없어 값을
        # 지어내면 정상 요청을 504로 끊을 위험이 더 크다 — 확인이
        # 필요합니다(추후 실측 후 별도 타이트닝).

        # 인파관리 API — /crowd 화면(HTML)은 아래 기본 `/` 규칙으로 그대로
        # platform-shell이 서빙하고, 이 API 경로만 crowd-service로 보낸다.
        location /api/crowd/ {
            proxy_pass         http://urbanguard_crowd;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/cases {
            proxy_pass         http://urbanguard_crowd;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ⚠️ 2026-08-31 — `/api/notifications/`도 crowd-service로 보낸다.
        # 실측 확인 결과 침수·교통위험 자동 알림(runner.py)은 자기 자신의
        # 독립된 AlertNotifier를 따로 쓰고 있어, 이 엔드포인트(발송 설정
        # 조회)는 사실상 인파 사례 알림에만 쓰이고 있었다 — crowd_service.py
        # §core/common 처리 원칙 주석 참고.
        location /api/notifications/ {
            proxy_pass         http://urbanguard_crowd;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # 노면관리 API(Phase 2) — /road·/road/detect 화면(HTML)은 아래
        # 기본 `/` 규칙으로 그대로 platform-shell이 서빙한다.
        location /api/road/ {
            proxy_pass         http://urbanguard_road;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/road-analysis/ {
            proxy_pass         http://urbanguard_road;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/road-report/ {
            proxy_pass         http://urbanguard_road;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # 침수 API(Phase 4) — /flood 화면(HTML)은 아래 기본 `/` 규칙으로
        # 그대로 platform-shell이 서빙한다. SSE는 /api/flood-risk보다
        # 먼저 둔다(위 /api/stream/risk와 같은 이유 — 안 그러면 그 규칙에
        # 먼저 걸린다). SSE라 platform-shell `/`과 같은 버퍼링 해제·긴
        # 읽기 타임아웃이 필요하다(crowd/road엔 SSE가 없어 이 설정의
        # 전례가 없었다 — Phase 3 검토 당시 남겨 둔 gap을 여기서 채운다).
        location /api/stream/flood-risk {
            proxy_pass         http://urbanguard_flood;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
        }

        location /api/flood-risk {
            proxy_pass         http://urbanguard_flood;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/flood-history {
            proxy_pass         http://urbanguard_flood;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # 교통위험 API(Phase 4) — /traffic 화면(HTML)은 아래 기본 `/`
        # 규칙으로 그대로 platform-shell이 서빙한다. 이름을 그대로
        # 물려받는다(`/api/risk`류가 이미 "교통·기상 판정"을 가리키고
        # 있었다 — §Phase 4 상세 설계 참고). /api/stream/risk를
        # /api/risk보다 먼저 둔다.
        location /api/stream/risk {
            proxy_pass         http://urbanguard_traffic;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
        }

        location /api/risk {
            proxy_pass         http://urbanguard_traffic;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/history {
            proxy_pass         http://urbanguard_traffic;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/report/ {
            proxy_pass         http://urbanguard_traffic;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/traffic/roi-flow/propose {
            proxy_pass         http://urbanguard_traffic;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # 침수 S-23 분석 실행 이력의 미디어(run_id 기준)는 platform-shell에
        # 남아 있다 — nginx는 "가장 긴 접두사가 이긴다"는 규칙이라, 이
        # location이 아래 /media/ 보다 길어 먼저 확인되므로 순서와 무관하게
        # 항상 올바르게 갈린다(Starlette의 "등록 순서가 이긴다"는 규칙과
        # 다르다는 점에 주의 — main.py::api_flood_run_media 주석 참고).
        location /media/flood-runs/ {
            proxy_pass         http://urbanguard_platform;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # 인파 사례(케이스) 미디어 — 위 flood-runs보다 짧은 접두사라 그
        # location에 안 걸린 나머지 /media/* 만 여기로 온다.
        location /media/ {
            proxy_pass         http://urbanguard_crowd;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass         http://urbanguard_platform;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # /api/stream/risk(SSE)가 버퍼링 때문에 끊겨 보이지 않게 한다.
            proxy_buffering    off;
            proxy_read_timeout 3600s;
        }
    }
}
